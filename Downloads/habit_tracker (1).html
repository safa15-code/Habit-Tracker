<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ledger — Habit Tracker</title>
<style>
  :root{
    --paper:#EFEAE0;
    --paper-line:#DDD6C6;
    --ink:#232620;
    --ink-soft:#5B5A50;
    --moss:#4F6A4A;
    --moss-soft:#DCE3D4;
    --teal:#2E5F5C;
    --gold:#C79A2B;
    --clay:#A8492E;
    --card:#F7F4EC;
    --shadow: 0 1px 0 rgba(35,38,32,0.08);
    --radius:10px;
    --serif: 'Iowan Old Style','Palatino Linotype',Georgia,serif;
    --mono: 'SFMono-Regular','Menlo',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 34px;
    color:var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:36px 22px 0;}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  h1{font-size:30px;margin:0;font-weight:600;letter-spacing:0.2px;}
  h1 span{color:var(--moss);}
  .date{font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:0.5px;text-transform:uppercase;}
  .sub{color:var(--ink-soft);font-size:14px;margin:0 0 26px;}

  /* Dashboard */
  .dash{
    display:grid;
    grid-template-columns: 1.1fr 1fr 1fr;
    gap:14px;
    margin-bottom:30px;
  }
  .stat{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
    border:1px solid var(--paper-line);
  }
  .stat .label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-soft);}
  .stat .value{font-size:32px;font-weight:600;margin-top:4px;display:flex;align-items:baseline;gap:6px;}
  .stat .value small{font-size:13px;font-weight:400;color:var(--ink-soft);}
  .streakflame{color:var(--clay);}

  .ring-wrap{grid-column:span 1;display:flex;align-items:center;gap:14px;}
  .ring{position:relative;width:64px;height:64px;flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:600;}

  .week-strip{grid-column:1 / -1;background:var(--card);border-radius:var(--radius);border:1px solid var(--paper-line);box-shadow:var(--shadow);padding:16px 18px;}
  .week-strip .label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-soft);margin-bottom:10px;}
  .week-bars{display:flex;gap:8px;align-items:flex-end;height:52px;}
  .week-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .week-bar-track{width:100%;height:36px;background:var(--paper-line);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden;}
  .week-bar-fill{width:100%;background:var(--moss);border-radius:4px 4px 0 0;transition:height .3s ease;}
  .week-bar-day{font-family:var(--mono);font-size:10px;color:var(--ink-soft);}

  /* Habit list */
  .section-title{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;}
  .habit{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .habit .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .habit-main{flex:1;min-width:0;}
  .habit-name{font-size:16px;font-weight:600;}
  .habit-meta{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .days{display:flex;gap:5px;}
  .day-box{
    width:26px;height:26px;border-radius:6px;
    border:1px solid var(--paper-line);
    background:var(--paper);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;color:var(--ink-soft);
    transition:transform .12s ease;
    user-select:none;
  }
  .day-box:hover{transform:translateY(-1px);}
  .day-box.done{background:var(--moss);border-color:var(--moss);color:#fff;}
  .day-box.today{outline:2px solid var(--gold);outline-offset:1px;}
  .del-btn{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;padding:4px 6px;
    opacity:0.5;
  }
  .del-btn:hover{opacity:1;color:var(--clay);}

  .empty{
    text-align:center;color:var(--ink-soft);padding:40px 0;font-size:14px;
  }

  /* Add form */
  .add-row{
    display:flex;gap:10px;margin-top:18px;
  }
  .add-row input[type=text]{
    flex:1;
    font-family:var(--serif);
    font-size:15px;
    padding:12px 14px;
    border-radius:var(--radius);
    border:1px solid var(--paper-line);
    background:var(--card);
    color:var(--ink);
  }
  .add-row input[type=text]:focus{outline:2px solid var(--moss);outline-offset:1px;}
  .swatches{display:flex;gap:6px;align-items:center;}
  .swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .swatch.selected{border-color:var(--ink);}
  .add-btn{
    background:var(--moss);color:#fff;border:none;border-radius:var(--radius);
    padding:0 20px;font-family:var(--serif);font-size:15px;font-weight:600;cursor:pointer;
  }
  .add-btn:hover{background:#3f5a3b;}

  footer{text-align:center;color:var(--ink-soft);font-family:var(--mono);font-size:11px;margin-top:40px;}

  @media (max-width:600px){
    .dash{grid-template-columns:1fr 1fr;}
    .days{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ledger<span>.</span></h1>
    <div class="date" id="todayLabel"></div>
  </header>
  <p class="sub">A daily record of the things you're building.</p>

  <div class="dash">
    <div class="stat">
      <div class="label">Today</div>
      <div class="value" id="todayPct">—<small>% done</small></div>
    </div>
    <div class="stat">
      <div class="label">Best streak</div>
      <div class="value"><span class="streakflame">🔥</span> <span id="bestStreak">0</span><small>days</small></div>
    </div>
    <div class="ring-wrap stat">
      <div class="ring">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="27" stroke="#DDD6C6" stroke-width="7" fill="none"/>
          <circle id="ringFg" cx="32" cy="32" r="27" stroke="#4F6A4A" stroke-width="7" fill="none"
            stroke-dasharray="169.6" stroke-dashoffset="169.6" stroke-linecap="round"/>
        </svg>
        <div class="ring-pct" id="ringPct">0%</div>
      </div>
      <div>
        <div class="label">Habits</div>
        <div style="font-size:20px;font-weight:600;" id="habitCount">0</div>
      </div>
    </div>

    <div class="week-strip">
      <div class="label">Last 7 days</div>
      <div class="week-bars" id="weekBars"></div>
    </div>
  </div>

  <div class="section-title">Your habits</div>
  <div id="habitList"></div>
  <div class="empty" id="emptyState" style="display:none;">Nothing here yet — add your first habit below.</div>

  <div class="add-row">
    <input type="text" id="newHabitName" placeholder="Add a habit, e.g. Read 20 pages" maxlength="60">
    <div class="swatches" id="swatches"></div>
    <button class="add-btn" id="addBtn">Add</button>
  </div>

  <footer>saved automatically — private to you</footer>
</div>

<script>
const COLORS = ['#4F6A4A','#2E5F5C','#C79A2B','#A8492E','#5C5470','#3D6E85'];
let selectedColor = COLORS[0];
let habits = [];
const STORE_KEY = 'ledger:habits';

function todayStr(d=new Date()){
  return d.toISOString().slice(0,10);
}
function dateNDaysAgo(n){
  const d = new Date();
  d.setDate(d.getDate()-n);
  return todayStr(d);
}
function fmtDay(dstr){
  const d = new Date(dstr+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short'}).slice(0,2);
}

async function loadHabits(){
  try{
    const res = await window.storage.get(STORE_KEY);
    habits = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    habits = [];
  }
}
async function saveHabits(){
  try{
    await window.storage.set(STORE_KEY, JSON.stringify(habits));
  }catch(e){
    console.error('save failed', e);
  }
}

function computeStreak(habit){
  let streak = 0;
  let cursor = new Date();
  while(true){
    const ds = todayStr(cursor);
    if(habit.completions[ds]){
      streak++;
      cursor.setDate(cursor.getDate()-1);
    } else if (ds === todayStr()) {
      // today not done yet, don't break streak from yesterday
      cursor.setDate(cursor.getDate()-1);
      if(!habit.completions[todayStr(cursor)]) break;
    } else {
      break;
    }
  }
  return streak;
}

function renderSwatches(){
  const wrap = document.getElementById('swatches');
  wrap.innerHTML = '';
  COLORS.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'swatch' + (c===selectedColor ? ' selected':'');
    el.style.background = c;
    el.onclick = ()=>{ selectedColor = c; renderSwatches(); };
    wrap.appendChild(el);
  });
}

function renderDashboard(){
  const today = todayStr();
  const total = habits.length;
  document.getElementById('habitCount').textContent = total;

  const doneToday = habits.filter(h=>h.completions[today]).length;
  const pct = total ? Math.round((doneToday/total)*100) : 0;
  document.getElementById('todayPct').innerHTML = pct + '<small>% done</small>';

  const circumference = 169.6;
  const ring = document.getElementById('ringFg');
  ring.style.strokeDashoffset = circumference - (circumference*pct/100);
  document.getElementById('ringPct').textContent = pct+'%';

  const best = habits.reduce((m,h)=>Math.max(m, computeStreak(h)), 0);
  document.getElementById('bestStreak').textContent = best;

  const bars = document.getElementById('weekBars');
  bars.innerHTML = '';
  for(let i=6;i>=0;i--){
    const ds = dateNDaysAgo(i);
    const doneCount = habits.filter(h=>h.completions[ds]).length;
    const p = total ? (doneCount/total)*100 : 0;
    const col = document.createElement('div');
    col.className = 'week-bar-col';
    col.innerHTML = `
      <div class="week-bar-track"><div class="week-bar-fill" style="height:${p}%"></div></div>
      <div class="week-bar-day">${fmtDay(ds)}</div>
    `;
    bars.appendChild(col);
  }
}

function renderHabits(){
  const list = document.getElementById('habitList');
  const empty = document.getElementById('emptyState');
  list.innerHTML = '';
  empty.style.display = habits.length ? 'none' : 'block';

  habits.forEach(habit=>{
    const row = document.createElement('div');
    row.className = 'habit';

    const streak = computeStreak(habit);

    const days = document.createElement('div');
    days.className = 'days';
    for(let i=6;i>=0;i--){
      const ds = dateNDaysAgo(i);
      const box = document.createElement('div');
      box.className = 'day-box' + (habit.completions[ds] ? ' done':'') + (ds===todayStr() ? ' today':'');
      box.textContent = fmtDay(ds);
      box.onclick = async ()=>{
        if(habit.completions[ds]) delete habit.completions[ds];
        else habit.completions[ds] = true;
        await saveHabits();
        renderHabits();
        renderDashboard();
      };
      days.appendChild(box);
    }

    row.innerHTML = `
      <div class="dot" style="background:${habit.color}"></div>
      <div class="habit-main">
        <div class="habit-name">${habit.name}</div>
        <div class="habit-meta">${streak} day streak</div>
      </div>
    `;
    row.appendChild(days);

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.innerHTML = '✕';
    del.onclick = async ()=>{
      habits = habits.filter(h=>h.id !== habit.id);
      await saveHabits();
      renderHabits();
      renderDashboard();
    };
    row.appendChild(del);

    list.appendChild(row);
  });
}

async function addHabit(){
  const input = document.getElementById('newHabitName');
  const name = input.value.trim();
  if(!name) return;
  habits.push({
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    name,
    color: selectedColor,
    completions: {}
  });
  input.value = '';
  await saveHabits();
  renderHabits();
  renderDashboard();
}

document.getElementById('addBtn').onclick = addHabit;
document.getElementById('newHabitName').addEventListener('keydown', e=>{
  if(e.key==='Enter') addHabit();
});

document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});

(async function init(){
  renderSwatches();
  await loadHabits();
  renderHabits();
  renderDashboard();
})();
</script>
</body>
</html>
